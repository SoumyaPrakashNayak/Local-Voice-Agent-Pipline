spring:
  datasource:
    url: jdbc:h2:mem:crimelens_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: 4c8b9d3f5e1a7c2b8e4f0a9d3c5e7b1a9f0e2d4c6b8a0e2f4a6c8b0d2e4f6a8b
    access-token-expiration-ms: 3600000 # 1 hour
    refresh-token-expiration-ms: 86400000 # 24 hours
    issuer: crimelens-test

logging:
  level:
    root: WARN
    com.crimelens: INFO
